name: qinpatients-web

services:

  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   volumes:
  #     - ../frontend/:/app/result_build/

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  db:
    image: postgres:18-alpine
    ports:
      - "25432:5432"
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_INITDB_ARGS: >
        --encoding='UTF8'
        --locale='ru_RU.UTF-8'
        --set wal_level=logical
        --set wal_compression=zstd
      TZ: Asia/Omsk
    env_file:
      - ./.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: always

  # nginx:
  #   image: nginx:1.26.0-alpine
  #   ports:
  #     - "80:80"
  #   restart: always
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ../frontend/build:/usr/share/nginx/html/
  #     - static_value:/var/html/static/
  #     - media_value:/var/html/media/
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  static_value:
  media_value:
  db_data:
